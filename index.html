<div class="cols two"><div>${panel(dual('Thermal process overview','نظرة شاملة على تدفق الحرارة'),infoVisual()+`<div class="triplet">${kv(t('energyInput'),fixed(E.qFuel,1),'kW')}${kv(t('steamEnergy'),fixed(E.steamNet,1),'kW')}${kv(t('poolSide'),fixed(E.qPool,1),'kW')}</div>`)}${panel(dual('Recent energy movement','اتجاهات استهلاك الطاقة'),`<div class="chart-title">${t('fuelRate')} (Nm³/h)</div>${svgLine(S.history.map(p=>({ts:p.ts,value:p.fuel})),48,'Nm³/h',200)}`)}</div><div>${panel(dual('Live operating indicators','مؤشرات التشغيل الحالية'),`<div class="reading-list">${['pool_ph','pool_cl','pool_orp','filter_dp','b_pressure','b_level','b_o2','b_stack'].map(x=>readingCard(x)).join('')}</div>`)}${panel(t('action'),actionPreview(A,3))}</div></div>`}
function actionPreview(A,n=4){const subset=A.filter(a=>a.status==='critical'||a.status==='warning').slice(0,n);if(!subset.length)return `<p class="okline">✓ ${t('alarmNo')}</p><p class="undertext">${t('statusDesc')}</p>`;return subset.map(a=>`<div class="action-item"><span class="mini-dot ${a.status}"></span><div><b>${esc(a.title)}</b><p>${esc(a.action)}</p></div></div>`).join('')+`<button class="ghost" data-page="alarms">${t('alarms')} →</button>`}
function boilerView(E){const keys=['b_pressure','b_temp','b_steam','b_fuel','b_o2','b_stack','b_air','b_co','b_feedtemp','b_blow','b_cond','b_level'];return`${sectionIntro(t('boilerTitle'),dual('Steam-side engineering analysis • approved safety trips are external to this application','تحليل هندسي لجانب البخار • منظومات فصل الأمان خارج هذه الواجهة'))}<div class="cols two"><div>${panel(t('energyCalc'),`<div class="thermo-cycle"><div class="node hot"><b>${t('energyInput')}</b><strong>${fixed(E.qFuel,1)} kW</strong><small>Fuel × LHV</small></div><div class="node green"><b>${t('steamEnergy')}</b><strong>${fixed(E.steamNet,1)} kW</strong><small>ṁ × Δh / 3600</small></div><div class="node blue"><b>${t('boilerEff')}</b><strong>${E.validEnergy?fixed(E.boilerEta,1)+'%':'—'}</strong><small>Direct method / ${S.settings.currency}</small></div></div><div class="undertext">${dual('LHV/NCV basis. Steam enthalpy and feedwater enthalpy are engineer-entered reference data; therefore efficiency is calculated, not measured.','الأساس القيمة الحرارية الدنيا LHV. إنثالبي البخار ومياه التغذية قيم مرجعية يُدخلها المهندس، وبالتالي الكفاءة محسوبة وليست مقاسة مباشرة.')}</div>`)}</div><div>${panel(dual('Boiler balance / auxiliary indicators','اتزان الغلاية ومؤشرات المساعدة'),kv(t('blowRate'),fixed(E.blowPct,2),'%')+kv(t('blowLoss'),fixed(E.blowKw,2),'kW')+kv(t('airFuel'),fixed(E.af,2),'Nm³/Nm³')+kv(t('co2Day'),isNum(E.fuelCO2kg)?fixed(E.fuelCO2kg/1000,2):'—','tCO₂ / day')+`<div class="notice">${dual('High stack O₂ or temperature indicates a diagnostic issue, not a defensible fuel-savings figure without an audited combustion-loss model.','ارتفاع الأكسجين أو حرارة العادم مؤشر تشخيصي، ولا يتحول تلقائيًا إلى قيمة وفورات مالية دون نموذج معتمد لحساب فاقد الاحتراق.')}</div>`)}</div></div>
${panel(dual('Boiler field sensors','حساسات الغلاية'),`<div class="reading-list four">${keys.map(k=>readingCard(k,k==='b_steam'||k==='b_air'?0:1)).join('')}</div>`)}
<div class="cols two">${panel(dual('Thermal path to swimming pool','مسار انتقال الحرارة إلى المسبح'),infoVisual()+kv(t('steamSide'),fixed(E.qSteamHx,1),'kW')+kv(t('poolSide'),fixed(E.qPool,1),'kW')+kv(t('hxRatio'),fixed(E.hxRatio,1),'%'))}${panel(dual('Safety & commissioning','السلامة والاعتماد'),`<div class="critical-note"><b>⚠ ${dual('Safety-critical equipment','معدة عالية الخطورة')}</b><p>${dual('Independent certified pressure relief, low-water cutoffs, flame safeguards and emergency shutdown remain mandatory. This HTML never starts/stops the burner or changes combustion controls.','صمامات الأمان والحماية المستقلة من انخفاض المنسوب وفشل اللهب والإيقاف الطارئ تظل إلزامية. لا يمكن للواجهة تشغيل الموقد أو تعديل الاحتراق.')}</p></div><p>${dual('Check the steam-property pair and fuel LHV before interpreting calculated efficiency or losses.','راجع قيم الإنثالبي والقيمة الحرارية للوقود قبل اعتماد نتائج الكفاءة أو الفواقد.')}</p>`)}</div>`}
function pumpTable(E){return `<div class="tablewrap"><table><thead><tr><th>${t('pGroup')}</th><th>${t('flow')}</th><th>${t('head')}</th><th>${t('hydraulic')}</th><th>${t('power')}</th><th>${t('efficiency')}</th><th>${t('specific')}</th></tr></thead><tbody>${E.pumps.map((p,i)=>`<tr><td><b>${dual(['Recirculation','Filtration','Booster'][i],['تدوير','فلترة','تعزيز'][i])}</b></td><td>${fixed(p.flow,1)} m³/h</td><td>${fixed(p.head,1)} m</td><td>${fixed(p.hydraulic,2)} kW</td><td>${fixed(p.kw,1)} kW</td><td>${isNum(p.eta)&&p.eta<=100?fixed(p.eta,1)+'%':'—'}</td><td>${fixed(p.sec,3)} kWh/m³</td></tr>`).join('')}</tbody></table></div>`}
function pumpsView(E){return`${sectionIntro(t('pumpTitle'),dual('Electrical kW and fluid-mechanical performance / pump curves required for validation','قدرة كهربائية وأداء هيدروليكي / يلزم منحنى المصنع للتحقق'))}${panel(dual('Three duty pumps','ثلاث مضخات تشغيل'),pumpTable(E))}<div class="metrics-grid three">${E.pumps.map((p,i)=>metric(dual(['P-101 · Recirculation','P-102 · Filtration','P-103 · Booster'][i],['P-101 · التدوير','P-102 · الفلترة','P-103 · التعزيز'][i]),isNum(p.eta)&&p.eta<=100?fixed(p.eta,1):'—','%','Hydraulic / shaft ratio',i===0?'green':'cyan')).join('')}</div><div class="cols two">${panel(dual('Primary pump measurements','قراءات المضخة الرئيسية'),`<div class="reading-list">${['p1_flow','p1_ps','p1_pd','p1_kw','p1_rpm','p1_meff','p1_vib','p1_bearing'].map(k=>readingCard(k)).join('')}</div>`)}${panel(dual('Filter & recirculation diagnostics','تشخيص الفلتر والتدوير'),`<div class="reading-list">${['filter_dp','p2_flow','p2_kw','p2_vib','p3_flow','pool_flow'].map(k=>readingCard(k)).join('')}</div><p class="undertext">${dual('High filter ΔP requires comparison at the same flow rate and clean-filter baseline; investigate before backwashing.','يجب مقارنة فرق ضغط الفلتر عند نفس التدفق وبمرجع حالة الفلتر النظيف قبل اتخاذ قرار الغسيل العكسي.')}</p>`)}</div>${panel(t('vfd'),`<div class="metricline"><div><span>${dual('Current measured power','القدرة الحالية')}</span><b>${fixed(E.pumps[0].kw,2)} kW</b></div><div><span>${dual('Ideal power at','القدرة المثالية عند')} ${S.settings.vfdTarget}% ${dual('speed','سرعة')}</span><b>${fixed(E.vfdKw,2)} kW</b></div><div><span>${dual('Hypothetical reduction','انخفاض افتراضي')}</span><b>${fixed(E.vfdDiff,2)} kW</b></div></div><p class="undertext">${t('vfdFoot')}</p><button class="ghost" data-page="settings">${t('settings')}</button>`)}`}
function waterView(E){return`${sectionIntro(t('waterTitle'),dual('Water treatment indicators and laboratory validation','مؤشرات المعالجة التي تتطلب التحقق بالاختبار المعملي'))}<div class="metrics-grid four">${metric('pH',lastValue('pool_ph',2),'',statusTag(classify('pool_ph')),classify('pool_ph')==='normal'?'green':'red')}${metric(dual('Free chlorine','الكلور الحر'),lastValue('pool_cl',2),'mg/L',statusTag(classify('pool_cl')))}${metric(dual('Pool water temperature','درجة حرارة المياه'),lastValue('pool_temp',1),'°C',statusTag(classify('pool_temp')))}${metric(dual('Filter ΔP','فرق ضغط الفلتر'),lastValue('filter_dp',2),'bar',statusTag(classify('filter_dp')))}</div><div class="cols two">${panel(dual('Water chemistry','كيمياء المياه'),`<div class="reading-list">${['pool_ph','pool_cl','pool_combined','pool_orp','pool_turbid','pool_tds'].map(k=>readingCard(k)).join('')}</div>`)}${panel(dual('Water turnover and heating','تدوير المياه والتسخين'),`<div class="reading-list">${['pool_temp','pool_flow','pool_supply','pool_return','pool_makeup','pool_level','chem_enabled'].map(k=>readingCard(k)).join('')}</div>`+kv(t('oneDegree'),fixed(E.degkWh,1),'kWh'))}</div>${panel(dual('Operational water safety guidance','إرشادات السلامة التشغيلية للمياه'),`<p>${dual('CDC guidance supports pH 7.0–7.8. Minimum free chlorine depends on pool type and stabilizer; the sample bands above are editable and are not legal compliance settings for Egypt. Always validate local law, site design, bather load and chemical manufacturer limits.','تشير إرشادات CDC إلى نطاق pH من 7.0 إلى 7.8؛ ويتوقف الحد الأدنى للكلور الحر على نوع الحوض واستخدام المثبت. الحدود المعروضة افتراضية وليست اشتراطات قانونية معتمدة في مصر. يجب الرجوع للجهات المحلية وتصميم الموقع وتعليمات المصنع.')}</p><div class="notice">${dual('Required physical safeguard: stop chemical feed on low/no circulation using independent hardwired interlocks; dashboard alarms are supplementary only.','حماية مادية ضرورية: وقف حقن المواد الكيميائية عند فقد تدفق المياه بواسطة تعشيقات كهربائية مستقلة؛ إنذار الشاشة مكمل فقط.')}</div>`)}`}
function electricView(E){const p=read('el_pf'),apparent=isNum(E.electricKw)&&isNum(p)&&p>0?E.electricKw/p:null,reactive=isNum(apparent)&&isNum(E.electricKw)?Math.sqrt(Math.max(0,apparent**2-E.electricKw**2)):null;
 const items=[[dual('Recirculation pump','مضخة التدوير'),E.pumps[0].kw],[dual('Filter pump','مضخة الفلترة'),E.pumps[1].kw],[dual('Booster pump','مضخة التعزيز'),E.pumps[2].kw],[dual('Boiler fan','مروحة الغلاية'),read('b_fan')],[dual('Chemical dosing','حقن المعالجة'),read('chem_power')],[dual('Lighting','الإضاءة'),read('el_lights')],[dual('Other loads','أحمال أخرى'),read('el_other')]];
 return`${sectionIntro(t('electTitle'),dual('Submeter energy integration and power-quality screening','تجميع القراءات الفرعية وفحص جودة القدرة'))}<div class="metrics-grid four">${metric(t('electricity'),fixed(E.electricKw,1),'kW')}${metric(dual('Apparent power','القدرة الظاهرية'),fixed(apparent,1),'kVA')}${metric(dual('Reactive power','القدرة غير الفعالة'),fixed(reactive,1),'kvar')}${metric(dual('Power factor','معامل القدرة'),lastValue('el_pf',2),'PF')}</div><div class="cols two">${panel(dual('Electrical load breakdown','توزيع الأحمال الكهربائية'),`<div class="bar-list">${items.map(([lab,v])=>`<div><div class="split"><span>${lab}</span><b>${fixed(v,1)} kW</b></div>${pbar(v,Math.max(E.electricKw||1,1))}</div>`).join('')}</div>`)}${panel(dual('Main board measurements','قياسات اللوحة الرئيسية'),`<div class="reading-list">${['el_voltage','el_current','el_pf','el_other','el_lights','b_fan','chem_power'].map(k=>readingCard(k)).join('')}</div><div class="undertext">${dual('Three-phase S = P/PF is shown for an aggregate balanced-system screening; current and voltage are measured independently.','حساب القدرة الظاهرية P/PF لغرض العرض الافتراضي مع افتراض نظام متوازن؛ التيار والجهد مستقلان عن تجميع العدادات الفرعية.')}</div>`)}</div>`}
function energyView(E){return`${sectionIntro(t('energy'),dual('Cost, emissions, baselines and traceable calculation boundaries','التكلفة والانبعاثات وخط الأساس وحدود الحساب'))}<div class="metrics-grid four">${metric(t('energyInput'),fixed(E.qFuel,1),'kW')}${metric(t('steamEnergy'),fixed(E.steamNet,1),'kW')}${metric(t('electricity'),fixed(E.electricKw,1),'kW')}${metric(t('costDay'),money(E.costDay),'')}</div><div class="cols two">${panel(dual('Daily and monthly cost model','نموذج التكلفة اليومية والشهرية'),kv(dual('Gas cost per operating day','تكلفة الغاز لكل يوم تشغيل'),money(E.gasCost))+kv(dual('Electricity cost per operating day','تكلفة الكهرباء لكل يوم تشغيل'),money(E.elCost))+kv(t('costDay'),money(E.costDay))+kv(dual('Monthly assumption','إجمالي الشهر الافتراضي'),money(isNum(E.costDay)?E.costDay*S.settings.days:null))+`<p class="undertext">${dual('Assumes the same defined runtime for all demo loads. For production, integrate actual tariff and timestamped power / fuel readings.','يعتمد المثال على ساعات تشغيل واحدة لجميع الأحمال، وفي الواقع يجب تجميع القراءات الزمنية والتعريفة الفعلية.')}</p>`)}${panel(dual('Carbon inventory — preliminary only','الانبعاثات الكربونية — تقديرات أولية'),kv(dual('Fuel CO₂ (combustion indicative)','ثاني أكسيد الكربون للغاز (تقديري)'),isNum(E.fuelCO2kg)?fixed(E.fuelCO2kg/1000,3):'—','t/day')+kv(dual('Purchased electricity (indicative)','الكهرباء المشتراة (تقديري)'),isNum(E.elCO2kg)?fixed(E.elCO2kg/1000,3):'—','t/day')+kv(t('co2Day'),isNum(E.co2kgDay)?fixed(E.co2kgDay/1000,3):'—','t/day')+`<p class="undertext">${dual('Emission factors are editable demonstration placeholders. This is not a verified ISO 14064-1 inventory.','معاملات الانبعاث افتراضية وقابلة للتعديل؛ هذه ليست قائمة انبعاثات موثقة وفق ISO 14064-1.')}</p>`)}</div><div class="cols two">${panel(t('baseline'),kv(t('deltaFuel'),isNum(E.gDelta)?(E.gDelta>0?'+':'')+fixed(E.gDelta,1):'—','Nm³/h')+kv(t('deltaElec'),isNum(E.pDelta)?(E.pDelta>0?'+':'')+fixed(E.pDelta,2):'—','kW')+`<div class="notice">${t('estimate')}<br>${dual('The baseline is not weather-, attendance- or heating-load-normalized; therefore the dashboard does not claim verified energy savings.','الخط المرجعي غير مصحح للطقس أو الإشغال أو الحمل الحراري؛ لذلك لا يُعتمد كدليل على وفورات الطاقة.')}</div>`)}${panel(dual('Avoidable blowdown sensitivity','حساسية فاقد التفوير'),kv(t('blowRate'),fixed(E.blowPct,2),'%')+kv(t('blowLoss'),fixed(E.blowKw,2),'kW')+kv(dual('Reference at 35 kg/h','القيمة المرجعية عند 35 كجم/ساعة'),isNum(read('b_hblow'))&&isNum(read('b_hfeed'))?fixed(35*(read('b_hblow')-read('b_hfeed'))/3600,2):'—','kW')+`<p class="undertext">${dual('This is sensible enthalpy carried by blowdown relative to feedwater; net recoverable energy needs real flash/heat recovery design.','النتيجة تمثل فرق الإنثالبي المصاحب للتفوير بالنسبة إلى مياه التغذية؛ ولا تعني طاقة قابلة للاسترداد بالكامل.')}</p>`)}</div>${panel(dual('Hourly synthetic consumption trend','اتجاه استهلاك الوقود التجريبي بالساعة'),`<div class="chart-title">${t('electricity')} (kW)</div>${svgLine(S.history.map(p=>({ts:p.ts,value:p.electric})),48,'kW',220)}`)}`}
function alarmCards(E,A){const serious=A.filter(a=>a.status==='critical'||a.status==='warning');const missing=A.filter(a=>a.status==='missing');const all=[...serious,...missing];if(!all.length)return `<div class="empty-state"><div>✓</div><b>${t('alarmNo')}</b><p>${t('statusDesc')}</p></div>`;
 return all.map(a=>`<div class="alarm-card ${a.status}"><div class="alarm-top"><span>${statusTag(a.status)} <strong>${esc(a.title)}</strong></span><span class="small-label">${META[a.key]?esc(grp(META[a.key].group)):'Engineering'}</span></div><div class="alarm-columns"><div>${kv(t('reading'),isNum(a.v)?fixed(a.v,2):'—',META[a.key]?.unit||'')}${kv(t('range'),META[a.key]?esc(limitLabel(a.key)):'—')}${kv(t('severity'),t(a.status))}</div><div><b>${t('alertCause')}</b><p>${esc(a.impact.cause||a.desc)}</p><b>${t('energyImpact')}</b><p>${esc(a.impact.energy)}</p><b>${t('costImpact')}</b><p>${esc(a.impact.cost)}</p><b>${t('action')}</b><p>${esc(a.action)}</p></div></div><div class="alarm-bottom"><div><small>${t('owner')}: ${esc(a.owner)} · ${t('testAfter')}</small><p>${esc(a.impact.basis||a.verify)}</p></div><div class="ack-actions">${S.acks[a.id]?`<span class="ack-done">✓ ${t('acknowledged')} · ${timeLabel(S.acks[a.id])}</span>`:`<button class="ghost" data-ack="${esc(a.id)}">✓ ${t('ack')}</button>`}</div></div></div>`).join('');}
function alarmsView(E,A){const count=A.filter(a=>a.status==='critical').length;return`${sectionIntro(t('alarms'),dual('Severity-based operations triage · acknowledgments are not fault resolution','تصنيف أعطال التشغيل حسب الأولوية · إقرار الاطلاع لا يعني حل المشكلة'))}${banner(A)}<div class="metrics-grid three">${metric(t('critical'),String(count),'',dual('Prompt attention','تدخل عاجل'),'red')}${metric(t('warning'),String(A.filter(a=>a.status==='warning').length),'',dual('Investigate','يستلزم فحصًا'),'gold')}${metric(t('missing'),String(A.filter(a=>a.status==='missing').length),'',dual('Quality check','التحقق من البيانات'),'blue')}</div>${panel(dual('Active alarm register','سجل الإنذارات النشطة'),alarmCards(E,A))}${panel(dual('Maintenance action log','سجل إجراءات الصيانة'),`<div class="cols two"><label class="field"><span>${t('notes')}</span><textarea id="maintenanceNote" rows="3" placeholder="${t('notePrompt')}"></textarea></label><div class="log-action"><button class="primary" id="saveNote">＋ ${t('saveNote')}</button><p class="undertext">${dual('Log entries are stored locally on this device; no cloud audit trail or identity management.','تخزن الملاحظات محليًا على الجهاز دون سجل تدقيق سحابي أو إدارة صلاحيات.')}</p></div></div><div class="note-log">${S.notes.slice().reverse().slice(0,12).map(z=>`<div><small>${timeLabel(z.ts)} · ${esc(z.scenario)}</small><p>${esc(z.text)}</p></div>`).join('')||`<p class="undertext">${dual('No maintenance notes yet.','لا توجد ملاحظات صيانة مسجلة بعد.')}</p>`}</div>`)}`}

function safeImport(o){if(!o||o.version!==DEF.version||!o.readings||typeof o.readings!=='object'||Array.isArray(o.readings))throw Error('Unsupported schema');const fresh=deep(DEF);
 if(o.lang==='ar'||o.lang==='en')fresh.lang=o.lang;
 for(const k of Object.keys(R0))if(Object.hasOwn(o.readings,k)){const v=o.readings[k];if(v===null||isNum(v))fresh.readings[k]=v;else throw Error('Invalid reading: '+k)}
 if(o.settings&&typeof o.settings==='object'){for(const k of Object.keys(DEF_SETTINGS)){if(Object.hasOwn(o.settings,k)){if(k==='facility'&&typeof o.settings[k]==='string')fresh.settings[k]=o.settings[k].slice(0,120);else if(k!=='facility'&&k!=='currency'&&k!=='operatingMode'&&k!=='approvalStatus'&&isNum(o.settings[k]))fresh.settings[k]=o.settings[k];}}}
 if(o.thresholds&&typeof o.thresholds==='object')for(const k of Object.keys(LIMITS)){if(o.thresholds[k]){fresh.thresholds[k]={};for(const b of['cl','cw','ww','cc']){const v=o.thresholds[k][b];fresh.thresholds[k][b]=v===null||v===undefined?null:isNum(v)?v:null;}}}
 if(o.calibrations&&typeof o.calibrations==='object')for(const k of Object.keys(R0)){if(typeof o.calibrations[k]==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.calibrations[k]))fresh.calibrations[k]=o.calibrations[k];}
 if(o.quality&&typeof o.quality==='object')for(const k of Object.keys(R0))if(o.quality[k]==='missing')fresh.quality[k]='missing';
 if(Array.isArray(o.history))fresh.history=o.history.slice(-500).filter(x=>x&&typeof x.ts==='string'&&['normal','fuel','boilerloss','blow','pump','filter','ph','chlorine','pressure','multiple','manual'].includes(x.scenario)).map(x=>({ts:x.ts.slice(0,40),scenario:x.scenario,fuel:num(x.fuel),electric:num(x.electric),eta:num(x.eta),ph:num(x.ph),cl:num(x.cl),temp:num(x.temp),pump:num(x.pump),dp:num(x.dp)}));
 if(Array.isArray(o.notes))fresh.notes=o.notes.slice(-100).filter(n=>n&&typeof n.text==='string').map(n=>({ts:String(n.ts).slice(0,40),scenario:String(n.scenario).slice(0,60),text:n.text.slice(0,500)}));
 fresh.scenario=SCENARIOS.some(z=>z[0]===o.scenario)?o.scenario:'normal';return fresh;}

function getDocSections(){return [
 ['Research-informed design','أساس التصميم والمراجع',`<div class="richtext"><p>${dual('DOE Steam Systems: monitor fuel input, feedwater, steam production, blowdown, insulation and combustion trend. DOE Pumping Systems: measure operating duty point, mechanical/hydraulic power, use VFD affinity laws only for suitable systems. CDC MAHC: chemistry and recirculation controls must be interpreted with local legal rules. Manufacturer automation features offer central equipment status and alert logging, but this prototype remains advisory.','وزارة الطاقة الأمريكية: متابعة الوقود والتغذية وتوليد البخار والتفوير والفواقد. أنظمة المضخات: قياس نقطة التشغيل وكفاءة الطاقة وعدم تعميم وفورات VFD. نموذج CDC MAHC: مراقبة جودة المياه والتعشيقات المستقلة طبقًا للتشريعات المحلية. توفر أنظمة المصنّعين متابعة موحدة وإنذارات؛ أما هذا التطبيق فهو استشاري فقط.')}</p><div class="refs"><a href="https://www.energy.gov/cmei/femp/best-management-practice-8-steam-boiler-systems" target="_blank" rel="noopener">DOE · Steam boiler systems</a><a href="https://www.energy.gov/cmei/ito/pump-systems" target="_blank" rel="noopener">DOE · Pumping systems</a><a href="https://www.cdc.gov/model-aquatic-health-code/php/our-work/index.html" target="_blank" rel="noopener">CDC · Model Aquatic Health Code</a><a href="https://www.cdc.gov/healthy-swimming/toolkit/operating-public-pools-hot-tubs-and-splash-pads.html" target="_blank" rel="noopener">CDC · Public pool operations</a><a href="https://www.pentair.com/en-us/products/residential/pool-spa-equipment/pool-automation/intellicenter-control-system.html" target="_blank" rel="noopener">Pentair · Automation</a><a href="https://www.becsys.com/products/" target="_blank" rel="noopener">BECSys · Chemistry / filtration</a><a href="https://www.prominent.com/en/Products/Products/Measuring-Control-and-Sensor-Technology/Controllers/p-dulcopool-pro.html" target="_blank" rel="noopener">ProMinent · Pool controllers</a></div></div>`],
 ['Engineering equations','المعادلات الهندسية',`<div class="equation-grid"><div><b>Fuel input · طاقة الوقود</b><code>Q̇fuel [kW] = V̇fuel [Nm³/h] × LHV [kWh/Nm³]</code><small>${dual('Normalized gas flow and LHV must share the same reference conditions.','يجب توحيد شروط القياس المرجعية لحجم الغاز والقيمة الحرارية.')}</small></div><div><b>Useful steam · طاقة البخار</b><code>Q̇steam [kW] = ṁsteam [kg/h] × (hsteam − hfeed) [kJ/kg] ÷ 3600</code></div><div><b>Boiler efficiency · الكفاءة</b><code>ηboiler [%] = 100 × Q̇steam / Q̇fuel</code><small>${dual('Direct LHV method. Auxiliary electrical consumption accounted separately.','طريقة مباشرة على أساس LHV؛ الكهرباء المساعدة تحسب منفصلة.')}</small></div><div><b>Pump hydraulic power · القدرة الهيدروليكية</b><code>H = Δp/(ρg) + Δz; Ph [kW] = ρg(Q/3600)H/1000</code><small>${dual('Assumes same fluid; velocity head correction omitted in simplified demo.','يُفترض نفس السائل ولا يشمل المثال فرق طاقة السرعة.')}</small></div><div><b>Pump efficiency · كفاءة المضخة</b><code>ηpump = Ph/(Pelectrical × ηmotor) × 100</code><small>${dual('Motor η must be matched to actual load, not necessarily nameplate η.','كفاءة المحرك يلزم أن تناسب الحمل الفعلي، وليس بالضرورة قيمة لوحة البيانات.')}</small></div><div><b>Pool water heat · حرارة المياه</b><code>Qpool [kW] = (ρ×Qv×Cp×(Tout−Tin))/3600</code></div><div><b>Pool heating inventory · الطاقة الحرارية المخزنة</b><code>Eheat [kWh] = Vpool×ρ×Cp×ΔT/3600</code></div><div><b>Blowdown · التفوير</b><code>BD% = 100×ṁBD/(ṁBD+ṁsteam)</code><code>Q̇BD [kW] = ṁBD(hBD−hfeed)/3600</code></div><div><b>Electricity and cost · الكهرباء والتكلفة</b><code>E[kWh] = ∫P[kW]dt ; Cost = Σ(Ei×Tariffi)</code></div><div><b>VFD ideal power · تغيير السرعة</b><code>P₂/P₁ ≈ (N₂/N₁)³</code><small>${dual('Ideal screening only, not a guaranteed saving.','تقدير نظري فقط وليس وفورات مضمونة.')}</small></div></div>`],
 ['Signal architecture','معمارية الربط بالحساسات',`<div class="arch"><span>${dual('Instruments','أجهزة القياس')}</span>→<span>${dual('PLC / IoT gateway','PLC / بوابة IoT')}</span>→<span>${dual('Secure ingestion API','واجهة بيانات آمنة')}</span>→<span>${dual('Validation & calculations','التحقق والحساب')}</span>→<span>${dual('Alarm & dashboard','الإنذار واللوحة')}</span></div><p>${dual('Recommended live transport: Modbus TCP/RTU to an industrial gateway, OPC UA or MQTT (mutual TLS) to an edge service, then authenticated read-only HTTPS/WebSocket or SSE to this dashboard. Enforce source timestamps, sequence IDs, stale-value alarms, data buffers, signed calibration records, access control and immutable audit logs.','الربط المقترح: Modbus TCP/RTU إلى بوابة صناعية، ثم OPC UA أو MQTT بتأمين TLS إلى خدمة طرفية، ثم HTTPS مؤمّن للقراءة فقط للواجهة، مع توقيتات أصلية وإنذار فقد البيانات وسجلات معايرة وإدارة صلاحيات وسجل تدقيق لا يقبل العبث.')}</p>`],
 ['Implementation roadmap','خارطة النشر الفعلي',`<div class="step-list"><div><b>01</b><p>${dual('Survey P&IDs, pool schedule, steam/condensate boundaries, manufacturer manuals, legal pool parameters and approved trip limits.','حصر المخططات والمعدات وبرنامج التشغيل والمبادل وقواعد التشغيل القانونية وحدود الفصل المعتمدة.')}</p></div><div><b>02</b><p>${dual('Install/calibrate fuel, steam, water, flow, differential pressure, power and chemistry instruments. Confirm sample-line treatment and isolation.','تركيب ومعايرة عدادات الوقود والبخار والتدفق وفرق الضغط والكهرباء والكيمياء وتأكيد أماكن أخذ العينات.')}</p></div><div><b>03</b><p>${dual('Connect field devices via protected PLC/edge gateway, read-only DMZ broker, timestamping and historian. Separate OT from enterprise IT.','توصيل الأجهزة ببوابة صناعية مع فصل شبكات OT/IT، وتأمين نقل البيانات وتخزين السجل الزمني.')}</p></div><div><b>04</b><p>${dual('Validate equations, meter uncertainty, site-specific thresholds, physical chemical-feed interlocks, certified boiler safety logic, and scenario tests.','اختبار المعادلات وعدم اليقين والحدود الخاصة بالموقع وتعشيقات الحقن والحمايات المعتمدة وسيناريوهات العطل.')}</p></div><div><b>05</b><p>${dual('Establish normalized energy baseline under a formal M&V plan, run controlled improvement trials and verify achieved savings.','إعداد خط أساس مصحح بخطة قياس وتحقيق M&V، وتنفيذ تجارب تحسين ومراجعة الوفورات الفعلية.')}</p></div></div>`],
 ['Critical constraints','القيود الأساسية',`<div class="critical-note"><p>${dual('Do not infer boiler efficiency from only stack temperature or O₂. Do not claim certified water-quality compliance from unvalidated online probes. Never substitute web alarms for hardwired boiler cutouts, burner management, pressure relief or chemical-dose low-flow interlocks.','لا يصح استنتاج كفاءة الغلاية من حرارة العادم والأكسجين فقط، ولا اعتماد جودة المياه قانونياً من مجسات غير متحقق منها، ولا استبدال دوائر الأمان المستقلة للغلاية أو تعشيقات منع الحقن بإنذارات الشاشة.')}</p></div>`]
]}
function methodologyView(){return`${sectionIntro(t('method'),dual('Research basis · formulas · sensor architecture · commissioning roadmap','المراجع · المعادلات · هندسة الربط · خطة التشغيل'))}${getDocSections().map(([en,ar,body])=>panel(dual(en,ar),body)).join('')+panel(dual('Project site visual references','الصور المرجعية للمعدات'),`<div class="photo-reference-grid">${POOL_IMAGES.map((src,i)=>`<figure><img alt="Pool facility reference image" loading="lazy" src="${src}"><figcaption>${dual(['Pool & mechanical room','Pump maintenance','Filtration equipment'][i],['المسبح وغرفة الماكينات','صيانة المضخة','معدات الفلاتر'][i])}</figcaption></figure>`).join('')}</div>`)}`}
function reportBody(E,A){const title=t('reportTitle'),stamp=timeLabel(new Date().toISOString());return`<div class="printed"><h1>SEUOFY — ${title}</h1><p><b>${esc(S.settings.facility)}</b> · ${stamp} · ${t('demo')}</p><h2>${t('status')}: ${t(systemStatus(A))}</h2><table><thead><tr><th>${t('label')}</th><th>${t('reading')}</th></tr></thead><tbody>${[
 [t('fuelRate'),fixed(read('b_fuel'),2)+' Nm³/h'],[t('energyInput'),fixed(E.qFuel,1)+' kW'],[t('steamEnergy'),fixed(E.steamNet,1)+' kW'],[t('boilerEff'),fixed(E.boilerEta,2)+' %'],[t('electricity'),fixed(E.electricKw,2)+' kW'],[t('costDay'),money(E.costDay)],[t('blowLoss'),fixed(E.blowKw,2)+' kW'],[t('poolSide'),fixed(E.qPool,1)+' kW'],['pH',lastValue('pool_ph',2)],['Free chlorine',lastValue('pool_cl',2)+' mg/L'],[t('activeAlerts'),String(A.length)]].map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</tbody></table><h2>${t('alarms')}</h2><table><tr><th>${t('label')}</th><th>${t('severity')}</th><th>${t('action')}</th></tr>${A.map(a=>`<tr><td>${esc(a.title)}</td><td>${t(a.status)}</td><td>${esc(a.action)}</td></tr>`).join('')||`<tr><td colspan="3">${t('alarmNo')}</td></tr>`}</table><h2>${t('reportBoundary')}</h2><p>${dual('LHV-based steam efficiency, engineer-provided enthalpies, synthetic monitoring values, demo tariffs and indicative emissions. No certified measured energy saving and no equipment controls.','الكفاءة وفق LHV وإنثالبيات مرجعية، مع قراءات وهمية وتعريفات وهمية وانبعاثات تقديرية. لا توجد وفورات موثقة أو تحكم صناعي.')}</p><p><b>${dual('Energy calculation source','مرجع الحسابات')}:</b> DOE Pumping Systems, DOE Steam Systems, CDC MAHC 2024 (guidance). </p></div>`}
function docReport(E,A){let body=reportBody(E,A).replace(/<[^>]*class="[^\"]*"[^>]*>/g,match=>match);return `<!doctype html><html><head><meta charset="utf-8"><style>body{font:12pt Arial,sans-serif;margin:22mm;color:#18344d}h1{color:#0b567f}h2{color:#086c8f;border-bottom:1px solid #d0e2ea}table{border-collapse:collapse;width:100%;margin:14px 0}td,th{border:1px solid #abc2d2;padding:8px;text-align:left}th{background:#dceff7}p{line-height:1.6}</style></head><body dir="${S.lang==='ar'?'rtl':'ltr'}">${body}</body></html>`}
function navHTML(){const items=[['overview','⌂'],['boiler','♨'],['pumps','◉'],['water','≈'],['electric','⚡'],['energy','▥'],['alarms','⚠'],['simulator','◈'],['sensors','⌁'],['settings','⚙'],['reports','▤'],['method','◷']];return items.map(([key,ic])=>`<button class="navlink ${S.page===key?'active':''}" data-page="${key}" title="${t(key)}"><span class="navic">${ic}</span><span>${t(key)}</span>${key==='alarms'&&LAST_ALARMS.some(a=>['critical','warning'].includes(a.status))?'<em class="ping"></em>':''}</button>`).join('')}
let LAST_ALARMS=[];
function render(){const E=eng(),A=buildAlarms(E);LAST_ALARMS=A;const st=systemStatus(A);document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';document.title='SEUOFY | '+t('app');document.body.classList.toggle('rtl',S.lang==='ar');
 $('navItems').innerHTML=navHTML();$('titlebar').textContent=t(S.page);$('modeBadge').textContent=t('demo');$('brandSubtitle').textContent=dual('SMART AQUATIC UTILITIES · PHASE 2','مرافق مائية ذكية · المرحلة الثانية');$('footText').textContent=dual('SEUOFY · Boiler, Pump & Aquatic Energy Intelligence | Offline simulation. Advisory display only; independent safety devices and approved field commissioning required. No measured or certified savings.','SEUOFY · إدارة الغلايات والمضخات والمسابح | محاكاة دون اتصال. أداة استشارية فقط ولا تغني عن أنظمة الأمان والفحص والاعتماد بالموقع. لا توجد وفورات معتمدة.');$('langBtn').textContent=S.lang==='ar'?'English':'العربية';$('statusTop').innerHTML=`<span class="mini-dot ${st}"></span>${t(st)}`;$('siteTitle').textContent=S.settings.facility;
 $('statusDate').textContent=timeLabel(new Date().toISOString());
 $('mainView').innerHTML=({overview:()=>overview(E,A),boiler:()=>boilerView(E),pumps:()=>pumpsView(E),water:()=>waterView(E),electric:()=>electricView(E),energy:()=>energyView(E),alarms:()=>alarmsView(E,A),simulator:()=>scenarioView(E,A),sensors:sensorView,settings:settingsView,reports:()=>reportsView(E),method:methodologyView}[S.page]||(()=>overview(E,A)))();
 $('printRoot').innerHTML=reportBody(E,A);$('navMeta').innerHTML=`${t('demo')}<br>SEUOFY · PHASE 2`;persist();}
function toast(s){const el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3700)}
function changePage(p){if(!['overview','boiler','pumps','water','electric','energy','alarms','simulator','sensors','settings','reports','method'].includes(p))return;S.page=p;render();window.scrollTo({top:0,behavior:'smooth'});document.body.classList.remove('nav-open')}
function handleClick(e){const b=e.target.closest('[data-page],[data-scenario],[data-ack],#langBtn,#hamburger,#exportReadings,#exportHistory,#exportProject,#importProject,#downloadWord,#printPage,#resetSettings,#demoTick,#saveNote');if(!b)return;
 if(b.dataset.page){changePage(b.dataset.page);return}if(b.dataset.scenario){selectScenario(b.dataset.scenario);return}
 if(b.dataset.ack){S.acks[b.dataset.ack]=new Date().toISOString();render();toast(t('acknowledged'));return}
 switch(b.id){
 case'langBtn':S.lang=S.lang==='en'?'ar':'en';render();break;
 case'hamburger':document.body.classList.toggle('nav-open');break;
 case'exportReadings':exportReadings();break;case'exportHistory':exportHistory();break;
 case'exportProject':exportProject();break;case'importProject':$('projectInput').click();break;
 case'printPage':window.print();break;
 case'downloadWord':saveFile('seuofy_pool_operational_report.doc',docReport(eng(),buildAlarms(eng())),'application/msword');break;
 case'resetSettings':S.settings=deep(DEF_SETTINGS);S.thresholds=deep(LIMITS);appendHistory();render();toast(t('resetSettings'));break;
 case'demoTick':tick(true);break;
 case'saveNote':{const inp=$('maintenanceNote');const txt=inp?.value.trim();if(!txt){toast(t('notePrompt'));return}S.notes.push({ts:new Date().toISOString(),scenario:S.scenario,text:txt.slice(0,500)});render();toast(t('saveNote'));break;}
 }
}
function validLimits(z){const a=['cl','cw','ww','cc'].map(k=>z[k]).filter(isNum);return a.every((v,i)=>i===0||v>=a[i-1]);}
function handleChange(e){const el=e.target;
 if(el.dataset.calib){const k=el.dataset.calib;if(!Object.hasOwn(R0,k))return;const v=el.value;if(v&& !/^\d{4}-\d{2}-\d{2}$/.test(v)){toast(dual('Invalid calibration date','تاريخ معايرة غير صالح'));return}S.calibrations[k]=v;persist();toast(dual('Calibration metadata saved (not verified)','تم حفظ تاريخ المعايرة دون التحقق من الشهادة'));return}
 if(el.dataset.reading){const key=el.dataset.reading;const v=num(el.value);if(!Object.hasOwn(R0,key))return;if(v===null&&el.value.trim()!==''){toast(dual('Invalid numeric reading','قراءة رقمية غير صالحة'));render();return}S.readings[key]=v;S.quality[key]=v===null?'missing':'ok';S.scenario='manual';appendHistory();render();return}
 if(el.dataset.quality){const k=el.dataset.quality;if(!Object.hasOwn(R0,k))return;S.quality[k]=el.value==='missing'?'missing':'ok';S.scenario='manual';appendHistory();render();return}
 if(el.dataset.setting){const k=el.dataset.setting;if(!Object.hasOwn(DEF_SETTINGS,k))return;const val=sanitizeSetting(k,el.value);if(val===null){toast(dual('Setting outside allowed model bounds','قيمة خارج نطاق الإدخال المسموح'));render();return}S.settings[k]=val;appendHistory();render();return}
 if(el.dataset.limit){const k=el.dataset.limit,b=el.dataset.bound;if(!Object.hasOwn(LIMITS,k)||!['cl','cw','ww','cc'].includes(b))return;const v=num(el.value);if(el.value.trim()!==''&&v===null){toast(dual('Invalid threshold','حد إنذار غير صالح'));render();return}const old=deep(S.thresholds[k]||{});S.thresholds[k][b]=v;if(!validLimits(S.thresholds[k])){S.thresholds[k]=old;toast(dual('Limits must progress from low to high','يجب ترتيب حدود الإنذار تصاعديًا'));render();return}appendHistory();render();return}
}
function tick(manual=false){if(!manual&&S.scenario!=='normal')return;const phase=S.history.length;
 if(S.scenario==='normal'){
 S.readings.b_fuel=Number((55+.35*Math.sin(phase*.41)).toFixed(2));S.readings.b_steam=Number((700+5*Math.sin(phase*.25)).toFixed(1));S.readings.pool_ph=Number((7.4+.035*Math.sin(phase*.32)).toFixed(2));S.readings.pool_cl=Number((2.2+.09*Math.cos(phase*.27)).toFixed(2));S.readings.p1_kw=Number((10.1+.15*Math.sin(phase*.35)).toFixed(2));}
 appendHistory();persist();if(manual||S.page!=='settings')render();if(manual)toast(dual('New simulated sample created','تم إنشاء عينة محاكاة جديدة'));}
function onImport(e){const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>3_000_000){toast(dual('Project file is too large','ملف المشروع أكبر من المسموح'));return}file.text().then(s=>{const obj=JSON.parse(s);S=safeImport(obj);seedHistory();render();toast(dual('Project restored from local JSON','تم استيراد المشروع محليًا'))}).catch(er=>toast(dual('Import failed: ','تعذر الاستيراد: ')+er.message));}
function setup(){seedHistory();document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);$('projectInput').addEventListener('change',onImport);render();setInterval(()=>{if(!document.hidden)tick(false)},15000)}
setup();
</script></body></html>
